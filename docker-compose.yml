services:
  postgres:
    image: postgres:15-alpine
    container_name: codeguard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codeguard_db}
      POSTGRES_USER: ${POSTGRES_USER:-codeguard_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeguard_secure_password_123}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codeguard_admin} -d ${POSTGRES_DB:-codeguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  spring-boot-core:
    build:
      context: ./backend/spring-boot-core
      dockerfile: Dockerfile
    container_name: codeguard-spring-boot-core
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-codeguard_db}
      POSTGRES_USER: ${POSTGRES_USER:-codeguard_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeguard_secure_password_123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  developer-portal:
    build:
      context: ./developer-portal/react-typescript
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8080/api/health
    container_name: codeguard-developer-portal
    ports:
      - "5173:80"
    depends_on:
      - spring-boot-core

  admin-portal:
    build:
      context: ./admin-portal/angular-typescript
      dockerfile: Dockerfile
    container_name: codeguard-admin-portal
    ports:
      - "4200:80"
    depends_on:
      - spring-boot-core

  node-notification:
    build:
      context: ./services/node-notification
      dockerfile: Dockerfile
    container_name: codeguard-node-notification
    ports:
      - "3000:3000"
    environment:
      - NODE_PORT=3000

  flask-github-webhooks:
    build:
      context: ./services/flask-github-webhooks
      dockerfile: Dockerfile
    container_name: codeguard-flask-webhooks
    ports:
      - "5000:5000"
    environment:
      - FLASK_PORT=5000
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka

  python-ai:
    build:
      context: ./services/python-ai
      dockerfile: Dockerfile
    container_name: codeguard-python-ai
    ports:
      - "8000:8000"

  csharp-analyzer:
    build:
      context: ./services/csharp-analyzer
      dockerfile: Dockerfile
    container_name: codeguard-csharp-analyzer
    ports:
      - "5001:5001"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: codeguard-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: codeguard-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres-data:
